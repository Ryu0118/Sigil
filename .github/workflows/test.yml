name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.7.5

      - name: SwiftFormat
        run: mise exec -- swiftformat --lint .

      - name: SwiftLint
        run: mise exec -- swiftlint lint --config .swiftlint.yml --strict

      - name: my-swift-linter
        run: mise exec -- my-swift-linter lint

  build-and-test:
    name: Build and Test
    needs: lint
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
